events {
    worker_connections 1024;
}

http {
    client_max_body_size 10m;
    resolver 127.0.0.11 valid=30s;

    #########################################################
    # 1. HTTP server for api.ingress.academy (port 80 only) #
    #########################################################
    server {
        listen 80;
        listen [::]:80;
        server_name api.ingress.academy;

        location /users {
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_redirect off;
            proxy_pass http://host.docker.internal:8080/users;
        }

        location /course-ms {
           proxy_set_header Host              $host;
           proxy_set_header X-Forwarded-Host  $host;
           proxy_set_header X-Forwarded-Proto $scheme;
           proxy_set_header X-Forwarded-Port  $server_port;
           proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
           proxy_redirect off;
            proxy_pass http://host.docker.internal:9091/course-ms;
        }

        location /certificate-ms {
            proxy_pass http://host.docker.internal:8181/certificate-ms;
        }

        location /event-ms {
            proxy_pass http://host.docker.internal:8686/event-ms;
        }

        location /online {
            proxy_pass http://host.docker.internal:4001/online;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://host.docker.internal:9090/docs;
        }

        location /applications-ms {
            proxy_pass http://host.docker.internal:8083/applications-ms;
        }

        location /assessments-ms {
            proxy_pass http://host.docker.internal:8180/assessments-ms;
        }

        location /notifications {
            client_max_body_size 1G;
            proxy_pass http://host.docker.internal:8084/notifications;
        }

        location /blog-ms {
                    proxy_pass http://host.docker.internal:8085/blog-ms;
                }

        location /files {
            client_max_body_size 1G;
            proxy_pass http://host.docker.internal:8082/files;
        }

        location /admin {
            rewrite /admin(.*) /$1 break;
            proxy_pass http://host.docker.internal:3002;
        }

       location /console {
          return 301 /console/;
       }

      # Match requests starting with /console
      location /console/ {
          proxy_pass http://host.docker.internal:8000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
          proxy_pass http://host.docker.internal:3000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
            }

    }

    #########################################################################
    # 2. HTTPS server for api.ingress.academy (serves all the same routes) #
    #########################################################################
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name api.ingress.academy;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        location /users {
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port  $server_port;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_redirect off;
            proxy_pass http://host.docker.internal:8080/users;
        }

        location /course-ms {
            proxy_pass http://host.docker.internal:9091/course-ms;
        }

        location /certificate-ms {
            proxy_pass http://host.docker.internal:8181/certificate-ms;
        }

        location /event-ms {
            proxy_pass http://host.docker.internal:8686/event-ms;
        }

        location /blog-ms {
            proxy_pass http://host.docker.internal:8085/blog-ms;
        }

        location /online {
            proxy_pass http://host.docker.internal:4001/online;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass http://host.docker.internal:9090/docs;
        }

        location /chat {
            proxy_pass http://host.docker.internal:9090/chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /applications-ms {
            proxy_pass http://host.docker.internal:8083/applications-ms;
        }

        location /notifications {
            client_max_body_size 1G;
            proxy_pass http://host.docker.internal:8084/notifications;
        }

        location /assessments-ms {
            proxy_pass http://host.docker.internal:8180/assessments-ms;
        }

        location /files {
            client_max_body_size 1G;
            proxy_pass http://host.docker.internal:8082/files;
        }

        location /admin {
            rewrite /admin(.*) /$1 break;
            proxy_pass http://host.docker.internal:3002;
        }

        location /console {
            return 301 /console/;
        }

        location /console/ {
            proxy_pass http://host.docker.internal:8000;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }

       location / {
            proxy_pass http://host.docker.internal:3000;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }
    }
}