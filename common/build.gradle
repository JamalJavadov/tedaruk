plugins {
    id 'java-library'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = '17'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}

dependencies {

    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-starter-security'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.springframework.kafka:spring-kafka'


    implementation group: 'org.hibernate.orm', name: 'hibernate-jcache', version: '6.2.6.Final'
    runtimeOnly group: 'org.ehcache', name: 'ehcache', version: '3.10.8'


    implementation 'org.reflections:reflections:0.10.2'
    implementation "org.passay:passay:$passayVersion"
    implementation "com.google.guava:guava:$guavaVersion"

    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.9'
    implementation group: 'commons-validator', name: 'commons-validator', version: '1.7'
    compileOnly "org.modelmapper:modelmapper:$modelmapperVersion"

    implementation "org.springframework.boot:spring-boot-starter-actuator"


    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
}
