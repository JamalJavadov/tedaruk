image: gradle:jdk17

stages:
  - build
  - branchname-check
  - static-analysis
  - test
  - docker_build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  GIT_SUBMODULE_STRATEGY: recursive

cache:
  key: gradle-$CI_PROJECT_ID
  paths:
    - .gradle/wrapper
    - .gradle/caches

before_script:
  - chmod +x gradlew

build:
  tags:
    - docker-ubuntu
  stage: build
  script:
    - ./gradlew --no-daemon clean assemble -x test

branch-name-check:
  stage: branchname-check
  tags:
    - docker-ubuntu
  script:
    - |
      if [[ ! "$CI_COMMIT_REF_NAME" =~ ^[0-9]+($|-.*) ]]; then
        echo "❌ Branch name must be <id>-description, e.g., 8-login-fix"
        exit 1
      fi
  rules:
    - if: $CI_MERGE_REQUEST_ID

static-analysis:
  tags:
    - docker-ubuntu
  stage: static-analysis
  allow_failure: true
  needs:
    - job: build
      optional: true

  script:
  
    # 1️⃣ Install xsltproc (ONLY missing dependency)
    - apt-get update && apt-get install -y xsltproc

    # 2️⃣ Run checks but DO NOT fail the job yet
    - ./gradlew --no-daemon check --console=plain --warning-mode=all || true

    # 3️⃣ Convert PMD XML → Code Climate JSON for MR UI
    - curl -s -o pmd2codeclimate.xsl https://raw.githubusercontent.com/pmd/pmd/master/pmd-cli/src/main/resources/pmd2codeclimate.xsl
    - xsltproc pmd2codeclimate.xsl build/reports/pmd/pmdMain.xml > gl-code-quality-report.json

    # 4️⃣ Now fail the job if PMD violations exist
    - ./gradlew --no-daemon pmdMain

  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json
    paths:
      - build/reports/checkstyle/
      - build/reports/pmd/
    expire_in: 1 week

  rules:
    - if: $CI_MERGE_REQUEST_ID  

test:
  tags:
    - docker-ubuntu
  stage: test
  needs: ["build"]
  script:
    - ./gradlew --no-daemon test

docker_build:
  tags:
    - docker-ubuntu
  stage: docker_build
  needs: ["test"]

  before_script:
    - chmod +x gradlew
    - export SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-db}
    - export SERVER_PORT=${SERVER_PORT}
    - export CLIENT_ID=${CLIENT_ID}
    - export CLIENT_SECRET=${CLIENT_SECRET}
    - export REDIRECT_URI=${REDIRECT_URI}
    - export TOKEN_URL=${TOKEN_URL}
    - export RESOURCE_BASE=${RESOURCE_BASE}
    - export BASE_AUTH_URL=${BASE_AUTH_URL}
    - export UKS_URL=${UKS_URL}
    - export ASANIMZA_API_BASE_URL=${ASANIMZA_API_BASE_URL}
    - export APP_SECRET_KEY=${APP_SECRET_KEY}
    - export APP_NAME=${APP_NAME}
    - export KAFKA_BROKER_HOST_NAME=${KAFKA_BROKER_HOST_NAME}
    - export KAFKA_BROKER_PORT=${KAFKA_BROKER_PORT}
    - export DB_CONNECTION_IP=${DB_CONNECTION_IP}
    - export DB_CONNECTION_PORT=${DB_CONNECTION_PORT}
    - export DB_USERNAME=${DB_USERNAME}
    - export DB_PASSWORD=${DB_PASSWORD}
    - export DB_NAME=${DB_NAME}
    - export DB_SCHEMA=${DB_SCHEMA}
  script:
    - ./gradlew --no-daemon jib
      -Djib.to.image=$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
      -Djib.to.auth.username=$CI_REGISTRY_USER
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD