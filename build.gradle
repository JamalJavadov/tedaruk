plugins {
    id 'org.springframework.boot' version "$springBootVersion"
    id 'io.spring.dependency-management' version "$springDependencyManagerVersion"
    id 'com.google.cloud.tools.jib' version '3.4.3'
}

apply from: "common/gradle/common.gradle"
apply from: "common/gradle/jib.gradle"


ext {
    dockerRepoUrl = findProperty('dockerRepoUrl') ?: 'docker.io/your-namespace'
}

group = 'az.att.asan'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    implementation project(":common")
 //   implementation project(":common-security")

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
   // implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.apache.commons:commons-lang3:$apacheCommonsVersion"

    implementation "org.mapstruct:mapstruct:$mapstructVersion"
    annotationProcessor("org.mapstruct:mapstruct-processor:$mapstructVersion")

    implementation 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'
    implementation group: 'io.lettuce', name: 'lettuce-core', version: "$lettuceVersion"
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.10.0'

    implementation "org.modelmapper:modelmapper:$modelmapperVersion"

    runtimeOnly 'org.postgresql:postgresql:42.7.3'

    implementation 'org.springframework.kafka:spring-kafka'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'

    implementation("org.mapstruct:mapstruct:$mapstructVersion")

    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation('org.springframework.boot:spring-boot-starter-test') {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }

}

test {
    useJUnitPlatform()
}