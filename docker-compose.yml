services:
  db:
    hostname: postgres
    image: postgres:16
    platform: linux/arm64/v8
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: att
    ports:
      - "5432:5432"
  adminer:
    hostname: mysql
    image: adminer
    restart: always
    ports:
      - 8580:8080
  reverse_proxy:
    image: nginx:latest
    hostname: proxy
    container_name: reverse_proxy
    ports:
      - "4000:80"
      - "443:443"
    #    extra_hosts:
    #      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx-conf/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx-conf/cert/api.ingress.academy.pem:/etc/nginx/ssl/cert.pem
      - ./nginx-conf/cert/api.ingress.academy.key:/etc/nginx/ssl/key.pem
volumes:
  db_data:
  nginx:
  mongodb_data:

