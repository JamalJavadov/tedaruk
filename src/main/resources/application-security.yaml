security:
  jwt-properties:
    secret: ${APP_SECRET_KEY:}
    token-validity-in-seconds: 86400
    refresh-token-validity-in-seconds: 100000
  cors:
    allowed-origins: '*'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count'
    allow-credentials: true
    max-age: 1800
  allowed-redirect-hosts:
    - console.ingress.academy
    - localhost
    - 127.0.0.1