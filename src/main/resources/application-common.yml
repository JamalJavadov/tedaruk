server:
  port: 8081
  forward-headers-strategy: framework

  servlet:
    context-path: /asan
rest:
  connect:
    timeout: 5000
  read:
    timeout: 2000

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
  mvc:
    pathmatch:
      matchingStrategy: ANT_PATH_MATCHER
  main:
    allow-bean-definition-overriding: true
  application:
    name: ${APP_NAME:att-asan}
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

