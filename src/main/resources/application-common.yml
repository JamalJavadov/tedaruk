att:
  token:
    duration: 3600 # seconds
server:
  port: 8081
  forward-headers-strategy: framework

  servlet:
    context-path: /
rest:
  connect:
    timeout: 5000
  read:
    timeout: 2000

spring:
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 200
  mvc:
    pathmatch:
      matchingStrategy: ANT_PATH_MATCHER
  main:
    allow-bean-definition-overriding: true
  application:
    name: ${APP_NAME:tedaruk}
  jackson:
    serialization:
      FAIL_ON_EMPTY_BEANS: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

